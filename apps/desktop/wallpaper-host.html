<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GameScape Wallpaper</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      #video,
      #image {
        position: fixed;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        display: none;
        background: #000;
      }

      #effect {
        position: fixed;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        display: none;
      }
    </style>
  </head>
  <body>
    <video id="video" muted loop playsinline></video>
    <img id="image" alt="" />
    <canvas id="effect"></canvas>
    <script type="module">
      import { convertFileSrc } from "@tauri-apps/api/core";

      const params = new URLSearchParams(location.search);
      const kind = params.get("kind") ?? "video";
      const filePath = params.get("path") ?? "";
      const fit = params.get("fit") ?? "fill";
      const startPaused = params.get("paused") === "1";
      // Same vocabulary as the Windows wallpaper positions, mapped to CSS.
      const objectFit =
        { fill: "cover", span: "cover", fit: "contain", stretch: "fill", center: "none" }[fit] ??
        "cover";

      const video = document.getElementById("video");
      const image = document.getElementById("image");
      const canvas = document.getElementById("effect");

      let paused = startPaused;
      /** Normalised cursor target shared with the interactive effect loop. */
      const cursorTarget = { x: 0.5, y: 0.5 };

      /* ------------------------------------------------------------------ */
      /* Interactive effects (cursor-reactive)                              */
      /* ------------------------------------------------------------------ */

      const parseHex = (value, fallback) => {
        const match = /^#?([0-9a-f]{6})$/i.exec((value ?? "").trim());
        if (!match) return fallback;
        const parsed = Number.parseInt(match[1], 16);
        return {
          r: (parsed >> 16) & 255,
          g: (parsed >> 8) & 255,
          b: parsed & 255,
        };
      };
      const rgba = (color, alpha) =>
        `rgba(${color.r}, ${color.g}, ${color.b}, ${alpha})`;
      const mix = (a, b, t) => ({
        r: Math.round(a.r + (b.r - a.r) * t),
        g: Math.round(a.g + (b.g - a.g) * t),
        b: Math.round(a.b + (b.b - a.b) * t),
      });

      function drawOrbit(ctx, now, W, H, cx, cy, dominant, accent, trail) {
        const base = Math.min(W, H);
        const blobs = [
          { color: dominant, radius: base * 0.62, phase: 0, speed: 0.0009, orbit: base * 0.3 },
          { color: accent, radius: base * 0.46, phase: Math.PI, speed: 0.0013, orbit: base * 0.2 },
        ];
        for (const blob of blobs) {
          const px = cx + Math.cos(now * blob.speed + blob.phase) * blob.orbit;
          const py = cy + Math.sin(now * blob.speed * 1.4 + blob.phase) * blob.orbit * 0.7;
          const gradient = ctx.createRadialGradient(px, py, 0, px, py, blob.radius);
          gradient.addColorStop(0, rgba(blob.color, 0.4));
          gradient.addColorStop(1, rgba(blob.color, 0));
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, W, H);
        }
        for (let i = 0; i < trail.length; i += 1) {
          const point = trail[i];
          const ratio = i / trail.length;
          const alpha = ratio * ratio * 0.5;
          const r = 3 + 22 * ratio;
          const gradient = ctx.createRadialGradient(point.x, point.y, 0, point.x, point.y, r);
          gradient.addColorStop(0, rgba(accent, alpha));
          gradient.addColorStop(1, rgba(accent, 0));
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(point.x, point.y, r, 0, Math.PI * 2);
          ctx.fill();
        }
        const core = ctx.createRadialGradient(cx, cy, 0, cx, cy, 44);
        core.addColorStop(0, "rgba(240, 250, 255, 0.85)");
        core.addColorStop(0.25, rgba(accent, 0.55));
        core.addColorStop(1, rgba(dominant, 0));
        ctx.fillStyle = core;
        ctx.beginPath();
        ctx.arc(cx, cy, 44, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawRibbon(ctx, now, W, H, cx, cy, dominant, accent, trail) {
        const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.4);
        halo.addColorStop(0, rgba(dominant, 0.22));
        halo.addColorStop(1, rgba(dominant, 0));
        ctx.fillStyle = halo;
        ctx.fillRect(0, 0, W, H);

        const passes = [22, 15, 9, 4];
        const strokePath = (points, intensity) => {
          for (let pass = 0; pass < passes.length; pass += 1) {
            ctx.lineCap = "round";
            for (let i = 1; i < points.length; i += 1) {
              const t = i / (points.length - 1);
              const point = points[i];
              const previous = points[i - 1];
              const color = mix(accent, dominant, t);
              ctx.strokeStyle = rgba(color, (0.05 + pass * 0.05) * t * intensity);
              ctx.lineWidth = passes[pass] * (0.4 + t * 0.6);
              ctx.beginPath();
              ctx.moveTo(previous.x, previous.y);
              ctx.lineTo(point.x, point.y);
              ctx.stroke();
            }
          }
        };

        const idleIntensity = Math.max(0.15, 1 - trail.length / 50) * 0.6;
        const idlePoints = [];
        const span = W * 0.4;
        for (let i = 0; i <= 28; i += 1) {
          const t = i / 28;
          idlePoints.push({
            x: cx - span + t * span * 2,
            y: cy + Math.sin(t * 5 + now * 0.0016) * H * 0.07,
          });
        }
        strokePath(idlePoints, idleIntensity);
        if (trail.length >= 2) strokePath(trail, 1);

        const head = ctx.createRadialGradient(cx, cy, 0, cx, cy, 20);
        head.addColorStop(0, "rgba(240, 250, 255, 0.9)");
        head.addColorStop(0.4, rgba(accent, 0.55));
        head.addColorStop(1, rgba(accent, 0));
        ctx.fillStyle = head;
        ctx.beginPath();
        ctx.arc(cx, cy, 20, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawGrid(ctx, now, W, H, cx, cy, dominant, accent) {
        const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.45);
        halo.addColorStop(0, rgba(dominant, 0.2));
        halo.addColorStop(1, rgba(dominant, 0));
        ctx.fillStyle = halo;
        ctx.fillRect(0, 0, W, H);

        const influence = Math.min(W, H) * 0.3;
        const pulse = 0.75 + Math.sin(now * 0.002) * 0.25;

        ctx.lineWidth = 1;
        const columns = 16;
        for (let i = 0; i <= columns; i += 1) {
          const x = (W / columns) * i;
          const boost = Math.max(0, 1 - Math.abs(x - cx) / influence);
          ctx.strokeStyle = rgba(accent, (0.07 + boost * 0.55) * pulse);
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, H);
          ctx.stroke();
        }
        const rows = 10;
        for (let j = 0; j <= rows; j += 1) {
          const y = (H / rows) * j;
          const boost = Math.max(0, 1 - Math.abs(y - cy) / influence);
          ctx.strokeStyle = rgba(accent, (0.07 + boost * 0.55) * pulse);
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(W, y);
          ctx.stroke();
        }

        const node = ctx.createRadialGradient(cx, cy, 0, cx, cy, 16);
        node.addColorStop(0, "rgba(240, 250, 255, 0.9)");
        node.addColorStop(0.5, rgba(accent, 0.6));
        node.addColorStop(1, rgba(accent, 0));
        ctx.fillStyle = node;
        ctx.beginPath();
        ctx.arc(cx, cy, 16, 0, Math.PI * 2);
        ctx.fill();
      }

      function startInteractive() {
        // path = "effect|dominantHex|accentHex" (no leading #)
        const [effectName, dominantHex, accentHex] = filePath.split("|");
        const effect =
          effectName === "ribbon" || effectName === "grid" ? effectName : "orbit";
        const dominant = parseHex(dominantHex, { r: 124, g: 92, b: 255 });
        const accent = parseHex(accentHex, { r: 34, g: 211, b: 238 });

        canvas.style.display = "block";
        const ctx = canvas.getContext("2d");
        if (!ctx) return;

        const cur = { x: 0.18, y: 0.72 };
        const trail = [];
        let W = 0;
        let H = 0;

        const resize = () => {
          const dpr = window.devicePixelRatio || 1;
          W = window.innerWidth;
          H = window.innerHeight;
          canvas.width = Math.round(W * dpr);
          canvas.height = Math.round(H * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        };
        resize();
        window.addEventListener("resize", resize);

        const frame = (now) => {
          if (!paused) {
            cur.x += (cursorTarget.x - cur.x) * 0.08;
            cur.y += (cursorTarget.y - cur.y) * 0.08;
            const cx = cur.x * W;
            const cy = cur.y * H;

            const lifetime = effect === "ribbon" ? 900 : 650;
            trail.push({ x: cx, y: cy, t: now });
            while (trail.length && now - trail[0].t > lifetime) trail.shift();

            const background = ctx.createLinearGradient(0, 0, W, H);
            background.addColorStop(0, "#07090d");
            background.addColorStop(1, "#0c1016");
            ctx.fillStyle = background;
            ctx.fillRect(0, 0, W, H);

            if (effect === "orbit") {
              drawOrbit(ctx, now, W, H, cx, cy, dominant, accent, trail);
            } else if (effect === "ribbon") {
              drawRibbon(ctx, now, W, H, cx, cy, dominant, accent, trail);
            } else {
              drawGrid(ctx, now, W, H, cx, cy, dominant, accent);
            }
          }
          requestAnimationFrame(frame);
        };
        // Manual frame stepping for local harnesses and hidden windows.
        window.__gsFrame = frame;
        requestAnimationFrame(frame);
      }

      /* ------------------------------------------------------------------ */
      /* Media modes                                                        */
      /* ------------------------------------------------------------------ */

      let sourceError = "";
      if (kind === "interactive") {
        startInteractive();
      } else {
        const media = kind === "gif" ? image : video;
        media.style.objectFit = objectFit;
        media.style.display = "block";
        try {
          media.src = convertFileSrc(filePath);
        } catch (error) {
          sourceError = String(error);
        }
        if (kind !== "gif" && !startPaused) {
          video.play().catch(() => {
            /* autoplay blocked — stays on the first frame */
          });
        }
      }

      // Governor/UI control surface (called via webview eval).
      window.__gsHost = {
        setPaused(next) {
          paused = next;
          if (kind === "interactive" || kind === "gif") return;
          if (next) {
            video.pause();
          } else {
            video.play().catch(() => {});
          }
        },
        /** Cursor position from the host bridge (physical monitor px). */
        cursor(px, py) {
          if (kind !== "interactive" || !canvas.width || !canvas.height) return;
          cursorTarget.x = px / canvas.width;
          cursorTarget.y = py / canvas.height;
        },
      };

      // Diagnostics: the surface window title reports what this page sees,
      // so verification harnesses can read it with GetWindowText.
      window.setTimeout(() => {
        document.title =
          "GSDBG " +
          JSON.stringify({
            kind,
            tag: kind === "interactive" ? "CANVAS" : (kind === "gif" ? "IMG" : "VIDEO"),
            cw: window.innerWidth,
            ch: window.innerHeight,
            err: sourceError.slice(0, 80),
          });
      }, 2000);
    </script>
  </body>
</html>
