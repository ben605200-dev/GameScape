<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GameScape — Spike S1</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0e14;
      }

      .scene {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(1100px 550px at 18% 20%, rgba(124, 92, 255, 0.55), transparent 62%),
          radial-gradient(900px 480px at 82% 72%, rgba(34, 211, 238, 0.5), transparent 62%),
          linear-gradient(135deg, #0e1116, #151922 60%, #10141d);
        background-size: 130% 130%, 130% 130%, 100% 100%;
        animation: drift 18s ease-in-out infinite alternate;
      }

      @keyframes drift {
        from {
          background-position: 0% 0%, 100% 100%, 0 0;
        }
        to {
          background-position: 30% 25%, 65% 60%, 0 0;
        }
      }

      .beam {
        position: fixed;
        left: 0;
        top: 52%;
        width: 100%;
        height: 10px;
        background: linear-gradient(90deg, transparent, #22d3ee, transparent);
        transform: translateY(-50%);
        animation: sweep 5s linear infinite;
        opacity: 0.9;
      }

      @keyframes sweep {
        from {
          transform: translate(-100%, -50%);
        }
        to {
          transform: translate(100%, -50%);
        }
      }

      .card {
        position: fixed;
        left: 64px;
        top: 64px;
        padding: 26px 32px;
        border-radius: 16px;
        background: rgba(14, 17, 22, 0.78);
        border: 1px solid rgba(34, 211, 238, 0.5);
        box-shadow: 0 10px 48px rgba(0, 0, 0, 0.5);
        color: #f2f4f8;
        font: 600 26px/1.35 "Segoe UI", system-ui, sans-serif;
      }

      .clock {
        display: block;
        margin: 6px 0 10px;
        font-size: 66px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
      }

      .note {
        font-size: 17px;
        font-weight: 400;
        color: #a7afbf;
        max-width: 620px;
      }

      .stamp {
        margin-top: 14px;
        font-size: 13px;
        font-weight: 400;
        color: #6e7889;
      }
    </style>
  </head>
  <body>
    <div class="scene"></div>
    <div class="beam"></div>
    <div class="card">
      GameScape · Spike S1
      <span class="clock" id="clock">--:--:--</span>
      <div class="note">
        If you can read this behind your desktop icons, the desktop-layer attach
        worked. Compare two captures a few seconds apart: the clock and the beam
        prove the surface is live (not a screenshot).
      </div>
      <div class="stamp" id="stamp">—</div>
    </div>
    <script>
      const clock = document.getElementById("clock");
      const stamp = document.getElementById("stamp");
      const tick = () => {
        const now = new Date();
        clock.textContent = now.toLocaleTimeString();
        stamp.textContent = now.toISOString();
      };
      tick();
      setInterval(tick, 250);
    </script>
  </body>
</html>
