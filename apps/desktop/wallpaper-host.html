<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GameScape Wallpaper</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      /* Hard rules: the media fills the whole surface, always. */
      #video,
      #image {
        position: fixed;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        display: none;
        background: #000;
      }
    </style>
  </head>
  <body>
    <video id="video" muted loop playsinline></video>
    <img id="image" alt="" />
    <script type="module">
      import { convertFileSrc } from "@tauri-apps/api/core";

      const params = new URLSearchParams(location.search);
      const kind = params.get("kind") ?? "video";
      const filePath = params.get("path") ?? "";
      const fit = params.get("fit") ?? "fill";
      const startPaused = params.get("paused") === "1";
      // Same vocabulary as the Windows wallpaper positions, mapped to CSS.
      const objectFit =
        { fill: "cover", span: "cover", fit: "contain", stretch: "fill", center: "none" }[fit] ??
        "cover";

      const video = document.getElementById("video");
      const image = document.getElementById("image");
      const media = kind === "gif" ? image : video;

      media.style.objectFit = objectFit;
      media.style.display = "block";
      let sourceError = "";
      try {
        media.src = convertFileSrc(filePath);
      } catch (error) {
        sourceError = String(error);
      }
      if (kind !== "gif" && !startPaused) {
        video.play().catch(() => {
          /* autoplay blocked — stays on the first frame */
        });
      }

      // Governor/UI control surface (called via webview eval).
      window.__gsHost = {
        setPaused(paused) {
          // Animated GIFs cannot be paused simply; only video responds.
          if (kind === "gif") return;
          if (paused) {
            video.pause();
          } else {
            video.play().catch(() => {});
          }
        },
      };

      // Diagnostics: the surface window title reports what this page sees,
      // so verification harnesses can read it with GetWindowText.
      window.setTimeout(() => {
        const s = getComputedStyle(media);
        document.title =
          "GSDBG " +
          JSON.stringify({
            kind,
            tag: media.tagName,
            cw: media.clientWidth,
            ch: media.clientHeight,
            nw: media.naturalWidth,
            nh: media.naturalHeight,
            w: s.width,
            h: s.height,
            pos: s.position,
            fit: s.objectFit,
            disp: s.display,
            src: (media.currentSrc || media.src || "").slice(-50),
            err: sourceError.slice(0, 80),
          });
      }, 2000);
    </script>
  </body>
</html>
