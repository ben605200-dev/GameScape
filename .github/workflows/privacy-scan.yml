name: Privacy scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: Repository privacy scan
    runs-on: ubuntu-latest
    steps:
      # NOTE: pin third-party actions by commit SHA during Phase 10 hardening.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run privacy scan
        run: node scripts/privacy-scan.mjs
