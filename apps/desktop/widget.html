<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GameScape Widget</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a0f15;
        color: #e8eef6;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        user-select: none;
      }

      #root {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 7%;
        box-sizing: border-box;
        background:
          radial-gradient(
            120% 120% at 0% 0%,
            rgba(64, 128, 255, 0.18),
            transparent 60%
          ),
          #0a0f15;
        border: 1px solid rgba(120, 170, 255, 0.25);
      }

      .label {
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #7ea6d8;
        margin-bottom: 4%;
      }

      .big {
        font-size: min(18vh, 64px);
        font-weight: 600;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }

      .sub {
        font-size: min(5vh, 16px);
        color: #9fb6cf;
        margin-top: 3%;
      }

      .row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: min(5vh, 15px);
        margin-top: 4%;
      }

      .bar {
        height: 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.08);
        margin-top: 3%;
        overflow: hidden;
      }

      .bar > div {
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, #3f7dff, #6fd3ff);
        width: 0%;
        transition: width 0.5s ease;
      }

      .thumb {
        margin-top: 5%;
        height: 42%;
        border-radius: 6px;
        background-size: cover;
        background-position: center;
        background-color: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .cal-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 2%;
        margin-top: 3%;
      }

      .cal-head {
        text-align: center;
        color: #5d7fa6;
        font-size: min(3vh, 11px);
        padding: 4% 0;
      }

      .cal-cell {
        text-align: center;
        color: #9fb6cf;
        font-size: min(3.6vh, 13px);
        padding: 7% 0;
        border-radius: 50%;
      }

      .cal-cell.today {
        background: linear-gradient(135deg, #3f7dff, #6fd3ff);
        color: #ffffff;
        font-weight: 600;
      }

      .text-body {
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.25;
        color: #e8eef6;
        overflow: hidden;
      }

      .launch-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 5%;
        margin-top: 3%;
      }

      .launch-item {
        padding: 7% 5%;
        border-radius: 6px;
        border: 1px solid rgba(120, 170, 255, 0.35);
        background: rgba(20, 28, 40, 0.9);
        color: #e8eef6;
        font-family: inherit;
        font-size: min(3.6vh, 14px);
        text-align: center;
        cursor: pointer;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .launch-item:hover {
        background: rgba(48, 72, 110, 0.95);
        border-color: rgba(140, 190, 255, 0.6);
      }

      .launch-item:active {
        background: rgba(70, 110, 170, 0.95);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { convertFileSrc, invoke } from "@tauri-apps/api/core";

      const params = new URLSearchParams(location.search);
      const kind = params.get("kind") ?? "clock";
      const id = params.get("id") ?? "";
      const root = document.getElementById("root");

      const el = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      };

      function renderClock() {
        root.replaceChildren(
          el("div", "label", "Clock"),
          el("div", "big", "--:--"),
          el("div", "sub", ""),
        );
        const time = root.querySelector(".big");
        const date = root.querySelector(".sub");
        const tick = () => {
          const now = new Date();
          time.textContent = now.toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit",
          });
          date.textContent = now.toLocaleDateString([], {
            weekday: "long",
            day: "numeric",
            month: "long",
          });
        };
        tick();
        window.setInterval(tick, 1000);
      }

      function formatUptime(seconds) {
        const days = Math.floor(seconds / 86400);
        const hours = Math.floor((seconds % 86400) / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        if (days > 0) return `${days}d ${hours}h`;
        if (hours > 0) return `${hours}h ${minutes}m`;
        return `${minutes}m`;
      }

      function renderSystem() {
        root.replaceChildren(
          el("div", "label", "System"),
          el("div", "row"),
        );
        const row = root.querySelector(".row");
        const cpuLabel = el("span", "", "CPU");
        const cpuValue = el("span", "", "0%");
        row.append(cpuLabel, cpuValue);
        const cpuBar = el("div", "bar");
        const cpuFill = el("div");
        cpuBar.append(cpuFill);
        const row2 = el("div", "row");
        const ramLabel = el("span", "", "RAM");
        const ramValue = el("span", "", "0%");
        row2.append(ramLabel, ramValue);
        const ramBar = el("div", "bar");
        const ramFill = el("div");
        ramBar.append(ramFill);
        const uptime = el("div", "sub", "");
        root.append(cpuBar, row2, ramBar, uptime);

        const poll = async () => {
          try {
            const stats = await invoke("system_stats");
            cpuValue.textContent = `${Math.round(stats.cpuPercent)}%`;
            cpuFill.style.width = `${Math.max(2, Math.min(100, stats.cpuPercent))}%`;
            ramValue.textContent = `${Math.round(stats.memoryPercent)}%`;
            ramFill.style.width = `${Math.max(2, Math.min(100, stats.memoryPercent))}%`;
            uptime.textContent = `Up ${formatUptime(stats.uptimeSeconds)} · ${stats.memoryUsedMb} / ${stats.memoryTotalMb} MB`;
          } catch {
            uptime.textContent = "Stats unavailable";
          }
        };
        void poll();
        window.setInterval(() => void poll(), 2000);
      }

      async function renderWallpaper() {
        root.replaceChildren(
          el("div", "label", "Wallpaper"),
          el("div", "sub", "Loading…"),
        );
        const title = el("div", "sub", "");
        const kindLine = el("div", "sub", "");
        const thumb = el("div", "thumb");
        try {
          const report = await invoke("host_status");
          const applied = report?.applied ?? null;
          const surfaces = report?.surfaces ?? [];
          const label = applied ? applied.title : "Idle";
          root.replaceChildren(
            el("div", "label", "Wallpaper"),
            title,
            kindLine,
            thumb,
          );
          title.textContent = label;
          title.style.color = "#e8eef6";
          title.style.fontSize = "min(6vh, 20px)";
          let previewPath = null;
          let previewKind = applied?.kind ?? "";
          if (surfaces.length > 0) {
            previewKind = surfaces[0].kind;
            const lib = await invoke("library_list");
            const item = (lib ?? []).find(
              (entry) => entry.id === surfaces[0].mediaId,
            );
            previewPath = item?.thumbPath ?? item?.path ?? null;
          } else if (applied?.kind === "static") {
            const lib = await invoke("library_list");
            const item = (lib ?? []).find(
              (entry) => entry.id === applied.mediaId,
            );
            previewPath = item?.thumbPath ?? item?.path ?? null;
          }
          kindLine.textContent = applied
            ? `${previewKind}${surfaces.length > 0 ? ` · ${surfaces.length} monitor${surfaces.length === 1 ? "" : "s"}` : ""}`
            : "Nothing applied";
          if (previewPath) {
            thumb.style.backgroundImage = `url("${convertFileSrc(previewPath)}")`;
          }
        } catch {
          root.replaceChildren(
            el("div", "label", "Wallpaper"),
            el("div", "sub", "Unavailable"),
          );
        }
      }

      function renderCalendar() {
        const update = () => {
          const now = new Date();
          const year = now.getFullYear();
          const month = now.getMonth();
          root.replaceChildren(
            el(
              "div",
              "label",
              now.toLocaleDateString([], { month: "long", year: "numeric" }),
            ),
          );
          const grid = el("div", "cal-grid");
          for (const day of ["M", "T", "W", "T", "F", "S", "S"]) {
            grid.append(el("div", "cal-head", day));
          }
          const first = new Date(year, month, 1);
          const start = (first.getDay() + 6) % 7; // Monday-first
          const days = new Date(year, month + 1, 0).getDate();
          for (let blank = 0; blank < start; blank += 1) {
            grid.append(el("div", "cal-cell", ""));
          }
          for (let day = 1; day <= days; day += 1) {
            const cell = el("div", "cal-cell", String(day));
            if (day === now.getDate()) cell.classList.add("today");
            grid.append(cell);
          }
          root.append(grid);
        };
        update();
        window.setInterval(update, 60000);
      }

      async function renderCountdown() {
        let label = "Countdown";
        let target = null;
        try {
          const rows = await invoke("widgets_list");
          const row = (rows ?? []).find((entry) => String(entry.id) === String(id));
          if (row?.settings) {
            const parsed = JSON.parse(row.settings);
            if (typeof parsed.label === "string" && parsed.label.trim() !== "") {
              label = parsed.label;
            }
            if (typeof parsed.target === "string" && parsed.target !== "") {
              target = parsed.target;
            }
          }
        } catch {
          /* fall back to the empty state below */
        }

        root.replaceChildren(el("div", "label", label));
        const big = el("div", "big", "—");
        const sub = el("div", "sub", "");
        root.append(big, sub);
        if (!target) {
          sub.textContent = "Set a target date in Widgets";
          return;
        }
        const tick = () => {
          const remaining = new Date(target).getTime() - Date.now();
          if (Number.isNaN(remaining)) {
            big.textContent = "—";
            sub.textContent = "Invalid target date";
            return;
          }
          if (remaining <= 0) {
            big.textContent = "🎉";
            sub.textContent = "It's here!";
            return;
          }
          const days = Math.floor(remaining / 86400000);
          const hours = Math.floor((remaining % 86400000) / 3600000);
          const minutes = Math.floor((remaining % 3600000) / 60000);
          big.textContent = days > 0 ? `${days}d` : `${hours}h`;
          sub.textContent =
            days > 0 ? `${hours}h ${minutes}m to go` : `${minutes}m to go`;
        };
        tick();
        window.setInterval(tick, 1000);
      }

      async function renderText() {
        let text = "Your text here";
        let font = "Segoe UI";
        let size = 28;
        try {
          const rows = await invoke("widgets_list");
          const row = (rows ?? []).find((entry) => String(entry.id) === String(id));
          if (row?.settings) {
            const parsed = JSON.parse(row.settings);
            if (typeof parsed.text === "string" && parsed.text !== "") {
              text = parsed.text;
            }
            if (typeof parsed.font === "string" && parsed.font.trim() !== "") {
              font = parsed.font;
            }
            if (typeof parsed.size === "number" && Number.isFinite(parsed.size)) {
              size = parsed.size;
            }
          }
        } catch {
          /* keep the defaults */
        }
        root.replaceChildren(el("div", "label", "Text"));
        const body = el("div", "text-body", text);
        body.style.fontFamily = font;
        body.style.fontSize = `${Math.min(200, Math.max(10, size))}px`;
        root.append(body);
      }

      async function renderLauncher() {
        let items = [];
        try {
          const rows = await invoke("widgets_list");
          const row = (rows ?? []).find((entry) => String(entry.id) === String(id));
          if (row?.settings) {
            const parsed = JSON.parse(row.settings);
            if (Array.isArray(parsed.items)) {
              items = parsed.items.filter(
                (item) =>
                  item &&
                  typeof item.label === "string" &&
                  typeof item.target === "string" &&
                  item.target.trim() !== "",
              );
            }
          }
        } catch {
          /* fall through to the empty state */
        }

        root.replaceChildren(el("div", "label", "Launcher"));
        if (items.length === 0) {
          root.append(el("div", "sub", "Add shortcuts in the Widgets page"));
          return;
        }
        const grid = el("div", "launch-grid");
        for (const item of items.slice(0, 6)) {
          const button = el("button", "launch-item", item.label);
          button.type = "button";
          button.addEventListener("click", () => {
            invoke("widget_open", { target: item.target }).catch(() => {});
          });
          grid.append(button);
        }
        root.append(grid);
      }

      if (kind === "system") renderSystem();
      else if (kind === "wallpaper") void renderWallpaper();
      else if (kind === "calendar") renderCalendar();
      else if (kind === "countdown") void renderCountdown();
      else if (kind === "text") void renderText();
      else if (kind === "launcher") void renderLauncher();
      else renderClock();
    </script>
  </body>
</html>
