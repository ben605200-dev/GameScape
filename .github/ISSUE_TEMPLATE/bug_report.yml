name: Bug report
description: Report a problem with the GameScape desktop app or website.
title: "[Bug]: "
labels: ["type: bug", "status: needs-info"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

        **Privacy reminder:** do not include personal information — usernames, file paths,
        emails, computer names — or screenshots showing private content. Use the in-app
        diagnostics export (review it first) instead of raw logs.
  - type: checkboxes
    id: prechecks
    attributes:
      label: Before you continue
      options:
        - label: I searched existing issues and this has not been reported yet.
          required: true
        - label: This is not a security vulnerability (those go to SECURITY.md).
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we make it happen again?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Desktop app — wallpapers
        - Desktop app — animated wallpapers
        - Desktop app — widgets
        - Desktop app — layouts
        - Desktop app — library / imports
        - Desktop app — other
        - Website
        - Installer / updates
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: GameScape version
      placeholder: "e.g. 0.1.0 (Settings → About)"
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: "e.g. Windows 11 24H2 (winver)"
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (optional)
      description: Attach a reviewed diagnostics export if relevant. Remove anything you do not want to share.
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: GPU, monitor setup, whether the problem changes with Gaming Mode on/off, etc.
